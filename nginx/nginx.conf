worker_processes auto;
events {
    worker_connections 1024;
}

http {
    client_max_body_size 100m;
    # MIME types & default
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;

    # Proxy cache for static assets
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=STATIC:10m inactive=1h max_size=500m;

    # Upstreams
    upstream gateway {
        server gateway:8080;
        # server gateway:8080 max_fails=3 fail_timeout=30s;
    }
    upstream client {
        server client:3000;
        # server client:3000 max_fails=3 fail_timeout=30s;
    }

    # Map to detect preflight
    map $request_method $is_preflight {
        default 0;
        OPTIONS 1;
    }

    server {
        listen 80;
        server_name _;

        # Common security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self';" always;

        # CORS for API & AI
        location ~ ^/(api|ai)/ {
            add_header 'Access-Control-Allow-Origin'  'https://cache-me-if-you-can-genai-client.student.k8s.aet.cit.tum.de' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS'                      always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            if ($is_preflight) {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass         http://gateway;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # timeouts
            proxy_connect_timeout  30s;
            proxy_send_timeout     30s;
            proxy_read_timeout     300s;
        }

        # React app login/register & ws
        location ~ ^/(login|register|ws)$ {
            proxy_pass http://client;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }

        # Static assets & favicon
        location /static/ {
            proxy_pass        http://client;
            proxy_set_header  Host $host;
            proxy_cache       STATIC;
            proxy_cache_valid 200 1h;
            add_header        Cache-Control "public, max-age=3600";
        }
        location = /favicon.ico {
            proxy_pass       http://client;
            proxy_set_header Host $host;
            add_header       Cache-Control "public, max-age=86400";
        }

        # SPA catch-all
        location / {
            proxy_pass http://client;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        location @fallback {
            proxy_pass http://client;
            proxy_set_header Host $host;
        }

        # Health
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
