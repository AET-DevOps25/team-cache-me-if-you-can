apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-ingress
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cache-me-if-you-can-genai-client.student.k8s.aet.cit.tum.de
      secretName: cache-me-if-you-can-genai-client-tls
  rules:
    - host: cache-me-if-you-can-genai-client.student.k8s.aet.cit.tum.de
      http:
        paths:
          # Rule to route API traffic to the gateway service
          - path: /api/ # <--- New rule for API paths
            pathType: Prefix
            backend:
              service:
                name: gateway-service # <--- Points to your gateway service
                port:
                  number: 8080 # <--- Port of your gateway service (from gateway-service-service.yaml)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-service
                port:
                  number: 3000
