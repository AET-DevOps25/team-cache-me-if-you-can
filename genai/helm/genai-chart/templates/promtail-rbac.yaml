{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail-service-account
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.monitoring.promtail.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promtail-role
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.monitoring.promtail.name }}
rules:
- apiGroups: [""]
  resources:
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promtail-role-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.monitoring.promtail.name }}
subjects:
- kind: ServiceAccount
  name: promtail-service-account
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: promtail-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}