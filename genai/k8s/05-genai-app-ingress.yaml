apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-ingress
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dev.team-cache-me-if-you-can.student.k8s.aet.cit.tum.de
    secretName: dev-tls
  rules:
  - host: dev.team-cache-me-if-you-can.student.k8s.aet.cit.tum.de
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: genai-app-service
            port:
              number: 8000