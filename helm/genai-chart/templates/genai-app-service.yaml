apiVersion: v1
kind: Service
metadata:
  name: {{ include "genai-chart.fullname" . }}-genai-app-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "genai-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai-app
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "genai-chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: genai-app