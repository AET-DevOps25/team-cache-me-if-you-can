{{- if .Values.monitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.monitoring.prometheus.name }}-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.monitoring.prometheus.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.monitoring.prometheus.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.prometheus.name }}
    spec:
      serviceAccountName: prometheus-service-account
      containers:
      - name: {{ .Values.monitoring.prometheus.name }}
        image: {{ .Values.monitoring.prometheus.image }}
        args:
          - --config.file=/etc/prometheus/prometheus.yml
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
{{- end }} 