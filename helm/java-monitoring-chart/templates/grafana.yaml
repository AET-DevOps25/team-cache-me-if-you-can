apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.monitoring.grafana.name }}
  labels:
    app: {{ .Values.monitoring.grafana.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.monitoring.grafana.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.grafana.name }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.monitoring.grafana.adminPassword }}
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: grafana-datasources
          configMap:
            name: {{ .Values.monitoring.grafana.name }}-datasources
        - name: grafana-dashboards
          configMap:
            name: {{ .Values.monitoring.grafana.name }}-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.grafana.name }}
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: {{ .Values.monitoring.grafana.name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.monitoring.grafana.name }}-datasources
  labels:
    app: {{ .Values.monitoring.grafana.name }}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Values.monitoring.prometheus.service_name }}:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
