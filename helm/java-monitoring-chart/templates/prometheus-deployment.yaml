apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.monitoring.prometheus.name }}
  labels:
    app: {{ .Values.monitoring.prometheus.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.monitoring.prometheus.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.prometheus.name }}
    spec:
      serviceAccountName: {{ .Values.monitoring.prometheus.name }}-sa
      containers:
        - name: prometheus
        image: {{ .Values.monitoring.prometheus.image }}
        args:
            - "--config.file=/etc/prometheus/prometheus.yml"
        ports:
        - containerPort: 9090
        volumeMounts:
            - name: config-volume
          mountPath: /etc/prometheus
      volumes:
        - name: config-volume
        configMap:
            name: {{ .Values.monitoring.prometheus.name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.prometheus.service_name }}
  labels:
    app: {{ .Values.monitoring.prometheus.name }}
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: {{ .Values.monitoring.prometheus.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.monitoring.prometheus.name }}-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.monitoring.prometheus.name }}-role
rules:
- apiGroups: [""]
  resources:
  - nodes
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- apiGroups: ["extensions"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.monitoring.prometheus.name }}-rb
subjects:
- kind: ServiceAccount
  name: {{ .Values.monitoring.prometheus.name }}-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.monitoring.prometheus.name }}-role
  apiGroup: rbac.authorization.k8s.io 