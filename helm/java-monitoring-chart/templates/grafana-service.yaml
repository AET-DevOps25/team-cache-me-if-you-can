{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.grafana.name }}-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.monitoring.grafana.name }}
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
{{- end }} 