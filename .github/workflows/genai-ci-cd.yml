name: Genai CI/CD Pipeline

on:
  push:
    branches:
      - '**' # Runs on push to any branch
  pull_request:
    branches:
      - main # Runs on pull requests targeting main (for tests before merge)

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' # Ensure it runs for both pushes and PRs

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can adjust this version

      - name: Install dependencies
        run: pip install -r genai/requirements.txt

      - name: Run tests
        run: pytest genai/tests

  deploy_dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python3 -m pip install ansible
          ansible-galaxy collection install kubernetes.core

      - name: Deploy to Kubernetes with Ansible
        run: |
          ansible-playbook genai/ansible/deploy_genai.yml \
            -i genai/ansible/inventory \
            -e "target_env=development" \
            -e "image_tag=${{ github.sha }}"

