name: Docker Publish Gateway Service

on:
  push:
    branches:
      - main
      - server/gateway-ci-cd-deployment
    paths:
      - 'server/gateway/**'
      - '.github/workflows/docker-publish-gateway.yml'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build gateway-service (skip tests)
        working-directory: ./server/gateway
        run: ./gradlew clean build -x test

      - name: Run tests
        working-directory: ./server/gateway
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server/gateway
          file: ./server/gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/aet-devops25/team-cache-me-if-you-can/gateway-service:latest
            ghcr.io/aet-devops25/team-cache-me-if-you-can/gateway-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}