name: Docker Publish User Service

on:
  push:
    branches:
      - main
      - server/user-ci-cd-deployment # Keep this branch for dedicated CI/CD testing
    paths:
      - 'server/user/**'
      - '.github/workflows/docker-publish-user.yml'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build user-service (skip tests)
        working-directory: ./server/user
        run: ./gradlew clean build -x test

      - name: Run tests with test profile
        working-directory: ./server/user
        run: ./gradlew test -Dspring.profiles.active=test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server/user
          file: ./server/user/Dockerfile
          push: true
          tags: |
            ghcr.io/aet-devops25/team-cache-me-if-you-can/user-service:latest
            ghcr.io/aet-devops25/team-cache-me-if-you-can/user-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push-image # Ensure the image is built and pushed before deployment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on push to main branch

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }} # Make sure this secret is configured in your repo

      - name: Install Helm
        uses: azure/setup-helm@v3 # Use this action to install Helm CLI
        with:
          version: v3.14.0 # Specify a Helm version

      - name: Deploy user-service with Helm
        run: |
          helm upgrade --install user-service ./helm/user-service \
            --namespace cache-me-if-you-can-genai \
            --set image.tag=${{ github.sha }} \
            --set image.repository=ghcr.io/aet-devops25/team-cache-me-if-you-can/user-service
          
          # Optional: Wait for deployment to be ready
          kubectl rollout status deployment/user-service-user-service -n cache-me-if-you-can-genai --timeout=5m