name: Publish Server Docker Images

on:
  push:
    branches:
      - workflows/publish-group-service-and-user
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service
        run: |
          REPO_OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${{ REPO_OWNER_LOWERCASE }}/user-service:latest ./server/user
          docker push ghcr.io/${{ REPO_OWNER_LOWERCASE }}/user-service:latest

      - name: Build and push group-service
        run: |
          REPO_OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${{ REPO_OWNER_LOWERCASE }}/group-service:latest ./server/group
          docker push ghcr.io/${{ REPO_OWNER_LOWERCASE }}/group-service:latest

      - name: Build and push gateway-service
        run: |
          REPO_OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${{ REPO_OWNER_LOWERCASE }}/gateway-service:latest ./server/gateway
          docker push ghcr.io/${{ REPO_OWNER_LOWERCASE }}/gateway-service:latest
