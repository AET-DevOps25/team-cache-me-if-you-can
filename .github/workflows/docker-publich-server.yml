name: Docker Publish All Services

on:
  push:
    branches: [ main, workflows/publish-group-service-and-user ]
    paths:
      - 'server/**'
      - '.github/workflows/docker-publish-server.yml'

jobs:
  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [user, group, gateway]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build service (skip tests)
        working-directory: ./server/${{ matrix.service }}
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
          ./gradlew clean build -x test

      - name: Run tests (allow failures)
        working-directory: ./server/${{ matrix.service }}
        continue-on-error: true
        run: ./gradlew test --info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        timeout-minutes: 15
        with:
          context: ./server/${{ matrix.service }}
          file: ./server/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/aet-devops25/team-cache-me-if-you-can/${{ matrix.service }}-service:latest
            ghcr.io/aet-devops25/team-cache-me-if-you-can/${{ matrix.service }}-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
