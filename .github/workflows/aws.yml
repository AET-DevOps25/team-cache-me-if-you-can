name: Deploy Project to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: AWS
      url: "https://client.${{ vars.EC2_PUBLIC_IP }}.nip.io"

    steps:
      - name: Check all workflows status
        id: check_status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Checking workflows status for commit $COMMIT_SHA"

          required_workflows=(
            "Server CI/CD"
            "Docker Publish Genai App"
            "build and push React App"
          )

          response=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/runs?branch=main&event=workflow_run&status=completed&per_page=100")

          failed=0

          for wf_name in "${required_workflows[@]}"; do
            # Find the workflow run for this workflow name and commit SHA
            conclusion=$(echo "$response" | jq -r --arg wf "$wf_name" --arg sha "$COMMIT_SHA" '
              .workflow_runs[]
              | select(.name == $wf and .head_sha == $sha)
              | .conclusion
              ' | head -n 1)

            if [ -z "$conclusion" ]; then
              echo "Workflow '$wf_name' has no completed run for commit $COMMIT_SHA - assuming skipped, treating as success"
              continue
            elif [ "$conclusion" != "success" ]; then
              echo "Workflow '$wf_name' concluded with status: $conclusion"
              failed=1
            else
              echo "Workflow '$wf_name' succeeded"
            fi
          done

          if [ $failed -eq 1 ]; then
            echo "One or more required workflows did not succeed."
            exit 1
          fi

          echo "All required workflows succeeded or skipped."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "docker-compose-prod.yml"
          target: ./
      - name: Copy genai directory to VM Host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "./genai/"
          target: ./

      - name: Copy environment directory to VM Host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "./environment/"
          target: ./

      - name: SSH to VM and Create .env.prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            rm -f .env.prod
            touch .env.prod
            echo "WEAVIATE_URL=${{ secrets.WEAVIATE_URL }}" >> .env.prod
            echo "WEAVIATE_QUERY_DEFAULTS_LIMIT=${{ secrets.WEAVIATE_QUERY_DEFAULTS_LIMIT }}" >> .env.prod
            echo "WEAVIATE_AUTH_ANONYMOUS_ENABLED=${{ secrets.WEAVIATE_AUTH_ANONYMOUS_ENABLED }}" >> .env.prod
            echo "WEAVIATE_DEFAULT_VECTORIZER_MODULE=${{ secrets.WEAVIATE_DEFAULT_VECTORIZER_MODULE }}" >> .env.prod
            echo "WEAVIATE_ENABLE_MODULES=${{ secrets.WEAVIATE_ENABLE_MODULES }}" >> .env.prod
            echo "OPENAI_APIKEY=${{ secrets.OPENAI_APIKEY }}" >> .env.prod

      - name: SSH to VM and Execute Docker-Compose Up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            echo "Cleaning up Docker system..."
            docker compose -f docker-compose-prod.yml down
            docker system prune -af --volumes
            sudo rm -rf /tmp/*
            echo "Logging into Docker registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "Starting Docker Compose..."
            docker compose -f docker-compose-prod.yml --env-file=.env.prod pull
            docker compose -f docker-compose-prod.yml --env-file=.env.prod up -d
