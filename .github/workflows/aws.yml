name: Deploy Docker Images to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: AWS
      url: "https://client.${{ vars.EC2_PUBLIC_IP }}.nip.io"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "docker-compose-prod.yml"
          target: ./
      - name: Copy genai directory to VM Host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "./genai/"
          target: ./

      - name: Copy environment directory to VM Host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          source: "./environment/"
          target: ./

      - name: SSH to VM and Create .env.prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            rm -f .env.prod
            touch .env.prod
            echo "WEAVIATE_URL=${{ secrets.WEAVIATE_URL }}" >> .env.prod
            echo "WEAVIATE_QUERY_DEFAULTS_LIMIT=${{ secrets.WEAVIATE_QUERY_DEFAULTS_LIMIT }}" >> .env.prod
            echo "WEAVIATE_AUTH_ANONYMOUS_ENABLED=${{ secrets.WEAVIATE_AUTH_ANONYMOUS_ENABLED }}" >> .env.prod
            echo "WEAVIATE_DEFAULT_VECTORIZER_MODULE=${{ secrets.WEAVIATE_DEFAULT_VECTORIZER_MODULE }}" >> .env.prod
            echo "WEAVIATE_ENABLE_MODULES=${{ secrets.WEAVIATE_ENABLE_MODULES }}" >> .env.prod
            echo "OPENAI_APIKEY=${{ secrets.OPENAI_APIKEY }}" >> .env.prod

      - name: SSH to VM and Execute Docker-Compose Up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ${{ vars.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            echo "Cleaning up Docker system..."
            docker system prune -af --volumes
            echo "Logging into Docker registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "Starting Docker Compose..."
            docker compose -f docker-compose-prod.yml --env-file=.env.prod pull
            docker compose -f docker-compose-prod.yml --env-file=.env.prod up -d
