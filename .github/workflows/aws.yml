name: Deploy to AWS ECS with Terraform

on:
  push:
    # branches:
    #   - main

jobs:
  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./aws

      - name: Terraform Import Existing Resources
        run: |
          terraform import aws_iam_role.ecs_task_execution ecsTaskExecutionRole || true
          terraform import aws_lb.client_alb $(aws elbv2 describe-load-balancers --query 'LoadBalancers[?contains(LoadBalancerName, `client-alb`)].LoadBalancerArn' --output text) || true
          terraform import aws_lb_target_group.client_tg $(aws elbv2 describe-target-groups --query 'TargetGroups[?contains(TargetGroupName, `client-tg`)].TargetGroupArn' --output text) || true
        working-directory: ./aws

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./aws

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./aws

      - name: Output Client URL
        run: terraform output client_url
        working-directory: ./aws
