name: Server CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci-cd.yml'

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/team-cache-me-if-you-can

jobs:
  # 1) Build & push all three services in parallel
  build-and-push:
    name: Build & Push Service Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ user, group, gateway ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin

      - name: Build service (skip tests)
        working-directory: ./server/${{ matrix.service }}
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
          ./gradlew clean build -x test

      - name: Run tests (allow failures)
        working-directory: ./server/${{ matrix.service }}
        continue-on-error: true
        run: ./gradlew test --info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./server/${{ matrix.service }}
          file: ./server/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.service }}-service:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.service }}-service:${{ github.sha }}

  # 2) Terraform deploy
  terraform-deploy:
    name: Terraform Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: needs.build-and-push.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config use-context student
          kubectl config set-context --current --namespace=developmentv1
        env:
          KUBECONFIG: ~/.kube/config

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -auto-approve
        env:
          KUBECONFIG: ~/.kube/config
