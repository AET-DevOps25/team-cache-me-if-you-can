spring.application.name=group
server.port=8083

# Database configuration (will be overridden by env_file in Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging levels
logging.level.org.springframework=INFO
logging.level.com.devops25.group=TRACE

# Actuator endpoints for health checks etc.
management.endpoints.web.exposure.include=*

GROUP_SERVICE_URL=http://group-service:8083 # Add this line


# External service URLs (if needed for communication with other services like files)
# FILES_SERVICE_BASE_URL=http://files-service:8082 # Example: You might need this in your group service later to refer to files