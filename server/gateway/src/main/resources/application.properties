# Server configuration
server.port=8080

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# Service URLs - these will be overridden by Kubernetes environment variables
user.service.url=${USER_SERVICE_URL:http://localhost:8081}
files.service.url=${FILES_SERVICE_URL:http://localhost:8082}
genai.service.url=${GENAI_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.com.devops25=DEBUG