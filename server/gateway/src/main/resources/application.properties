# Server configuration
server.port=8080

# Actuator configuration for health checks
#management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.probes.enabled=true

management.endpoints.web.exposure.include=health,info,liveness,readiness
management.endpoint.health.probes.enabled=true

# Service URLs - these will be overridden by Kubernetes environment variables
user.service.url=${USER_SERVICE_URL:http://localhost:8081}
files.service.url=${FILES_SERVICE_URL:http://localhost:8082}
genai.service.url=${GENAI_SERVICE_URL:http://localhost:8000}
group.service.url=${GROUP_SERVICE_URL:http://localhost:8083}


logging.level.com.devops25=DEBUG

# For more detailed WebClient logs
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG

# NEW: Group Service Route
spring.cloud.gateway.routes[3].id=group_route
spring.cloud.gateway.routes[3].uri=${group.service.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/groups/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/v1/groups/(?<segment>.*), /api/v1/groups/${segment}
# Adjust RewritePath if your Group Service expects just /groups or /v1/groups