spring.application.name=files
server.port=8082

spring.datasource.url=jdbc:mysql://mysql:3306/files_database?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File upload configuration
spring.codec.max-in-memory-size=100MB
spring.webflux.multipart.max-in-memory-size=100MB

# Servlet multipart configuration (critical for file uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# Additional server-level configuration for large uploads
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB

jwt.secret=u8jA1hTSe7Z9Qa8bH6h+qOqEAvFR6l4dNMb7rJH4Jmg=
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true