spring.application.name=files
server.port=8082

spring.datasource.url=jdbc:mysql://mysql:3306/files_database?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.codec.max-in-memory-size=100MB
spring.webflux.multipart.max-in-memory-size=100MB

