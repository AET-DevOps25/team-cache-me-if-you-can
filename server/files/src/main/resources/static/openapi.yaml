openapi: 3.0.3
info:
  title: File Management API
  description: API for managing files within groups, including listing, uploading, downloading, and deleting files.
  version: 0.0.1
servers:
  - url: http://localhost:8082
    description: Local server
paths:
  /api/files/{groupId}:
    get:
      summary: List files in a group
      description: Retrieves a list of files associated with the specified group ID.
      operationId: listFiles
      parameters:
        - name: groupId
          in: path
          description: ID of the group to list files for
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          description: JWT Bearer token for authentication
          required: true
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: List of files retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileResponse'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files/{groupId}/upload:
    post:
      summary: Upload a file
      description: Uploads a file to the specified group.
      operationId: uploadFile
      parameters:
        - name: groupId
          in: path
          description: ID of the group to upload the file to
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          description: JWT Bearer token for authentication
          required: true
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
              required:
                - file
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files/download/{fileId}:
    get:
      summary: Download a file
      description: Downloads a file by its ID.
      operationId: downloadFile
      parameters:
        - name: fileId
          in: path
          description: ID of the file to download
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          description: JWT Bearer token for authentication
          required: true
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: File downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files/{fileId}:
    delete:
      summary: Delete a file
      description: Deletes a file by its ID, if the requester is the file's uploader.
      operationId: deleteFile
      parameters:
        - name: fileId
          in: path
          description: ID of the file to delete
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          description: JWT Bearer token for authentication
          required: true
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: File deleted successfully
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Requester is not the file owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    FileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the file
        fileName:
          type: string
          description: Name of the file
        uploaderUsername:
          type: string
          description: Username of the user who uploaded the file
        uploadedAt:
          type: string
          format: date-time
          description: Timestamp when the file was uploaded
      required:
        - id
        - fileName
        - uploaderUsername
        - uploadedAt
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Error message
      required:
        - status
        - error