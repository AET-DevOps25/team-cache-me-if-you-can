spring.application.name=user
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File upload configuration
spring.codec.max-in-memory-size=100MB
spring.webflux.multipart.max-in-memory-size=100MB

# Servlet multipart configuration (critical for file uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# Additional server-level configuration for large uploads
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB

# Enable Spring debug logging
logging.level.org.springframework=DEBUG
logging.level.com.devops25=TRACE

# Jackson serialization logging
logging.level.org.springframework.http.converter.json=TRACE

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.url=/openapi.yaml