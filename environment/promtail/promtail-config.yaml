server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
  - job_name: genai
    static_configs:
      - targets:
          - localhost
        labels:
          job: genai
          __path__: /var/lib/docker/containers/genai-app/*-json.log
    pipeline_stages:
      - docker: {}
  - job_name: genai-celery-worker
    static_configs:
      - targets:
          - localhost
        labels:
          job: genai-celery-worker
          __path__: /var/lib/docker/containers/genai-celery-worker/*-json.log
    pipeline_stages:
      - docker: {} 