global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'user-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8081']
  - job_name: 'files-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['files-service:8082']
  - job_name: 'gateway-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway-service:8080']
  - job_name: 'group-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['group-service:8083']
  - job_name: 'genai-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['genai-app-service:8000'] 