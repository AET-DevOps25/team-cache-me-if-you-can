services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    container_name: team-cache-me-if-you-can-client
    entrypoint:
      - /bin/sh
      - -lc
      - |
        npm install &&
        npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - app-network # Add to network
      
  genai-app:
    build:
      context: ./genai
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    container_name: genai-app
    volumes:
      - ./genai:/app
    env_file:
      - environment/.env.docker.genai
    environment:
      - WEAVIATE_URL=http://genai-weaviate:8080
      - CELERY_BROKER_URL=redis://genai-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://genai-redis:6379/0
    depends_on:
      - genai-weaviate
      - genai-redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  genai-celery-worker:
    build:
      context: ./genai
      dockerfile: Dockerfile
    container_name: genai-celery-worker
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    volumes:
      - ./genai:/app
    env_file:
      - environment/.env.docker.genai
    environment:
      - WEAVIATE_URL=http://genai-weaviate:8080
      - CELERY_BROKER_URL=redis://genai-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://genai-redis:6379/0
    depends_on:
      - genai-app
      - genai-redis
    networks:
      - app-network

  genai-redis:
    image: redis:7-alpine
    container_name: genai-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  genai-weaviate:
    image: semitechnologies/weaviate:1.23.7
    container_name: genai-weaviate
    ports:
      - "8084:8080"
      - "50051:50051" # gRPC
    volumes:
      - genai-weaviate-data:/var/lib/weaviate
    restart: on-failure:0
    env_file:
      - environment/.env.docker.genai
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai' # Using OpenAI for vectorization
      ENABLE_MODULES: 'text2vec-openai,generative-openai'
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - app-network

  user:
    build:
      context: ./server/user
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    container_name: user-service
    env_file: "environment/.env.docker.user"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network # Add to network

  gateway:
    build:
      context: ./server/gateway
    ports: ['8080:8080']
    container_name: gateway-service
    depends_on:
      - user
      - files
    environment:
      USER_SERVICE_URL: http://user-service:8081
      FILES_SERVICE_URL: http://files-service:8082
      GENAI_SERVICE_URL: http://genai-app:8000
      GROUP_SERVICE_URL: http://group:8083
    networks:
      - app-network # Add to network

  files:
    build:
      context: ./server/files
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    container_name: files-service
    env_file: "environment/.env.docker.files"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server/files/uploads:/uploads
    networks:
      - app-network # Add to network

  group:
    build:
      context: ./server/group
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    container_name: group-service
    env_file: "environment/.env.docker.group"
    environment:
      GENAI_SERVICE_URL: http://genai-app:8000/api/v1
    depends_on:
      mysql:
        condition: service_healthy
    command: [ "-Dspring.profiles.active=dev", "-Dlogging.level.root=DEBUG", "-Dlogging.level.org.springframework=DEBUG", "-Dlogging.level.com.devops25=TRACE" ]
    networks:
      - app-network # Add to network

  mysql:
    image: mysql:8.0.33
    container_name: mysql
    user: "999:999"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./environment/db_init:/docker-entrypoint-initdb.d
      - ./environment/volume/conf.d:/etc/mysql/conf.d
    env_file: "environment/.env.docker.mysql"
    command:
      - --lower-case-table-names=1
      - --socket=/tmp/mysql.sock
      - --pid-file=/tmp/mysql.pid
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network # Add to network

  prometheus:
    image: prom/prometheus:v2.37.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./environment/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:9.1.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./environment/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./environment/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=password
    depends_on:
      - prometheus
      - loki
    networks:
      - app-network

  loki:
    image: grafana/loki:2.6.1
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./environment/loki:/etc/loki
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yaml
    user: "0:0"  # Run as root to avoid permission issues
    networks:
      - app-network

  promtail:
    image: grafana/promtail:2.6.1
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./environment/promtail:/etc/promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      loki:
        condition: service_started
    networks:
      - app-network

volumes:
  mysql_data:
  genai-weaviate-data:
  loki-data:

networks:
  app-network:
    driver: bridge